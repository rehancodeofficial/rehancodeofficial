# GitHub Action for generating a contribution graph with a snake eating your contributions.

name: Generate Snake

# Controls when the action will run. This action runs every 6 hours.

on:
  schedule:
      # every 6 hours
    - cron: "0 */6 * * *"

# This command allows us to run the Action automatically from the Actions tab.
  workflow_dispatch:

# The sequence of runs in this workflow:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake-svg
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#E2652C&color_dots=#EBEDF0,#FED7AA,#FB923C,#EA580C,#9A3412
            dist/github-contribution-grid-snake-dark.svg?color_snake=#F2814F&color_dots=#17171B,#431407,#7C2D12,#C2410C,#F97316
            dist/github-contribution-grid-snake.gif?color_snake=#E2652C&color_dots=#EBEDF0,#FED7AA,#FB923C,#EA580C,#9A3412

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
