<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120" fill="none">
  <defs>
    <style>
      :root {
        --card-bg: #FFFFFF;
        --card-border: #E6E2DC;
        --card-title: #E2652C;
        --card-desc: #44403C;
        --card-lang: #7A736C;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --card-bg: #17171B;
          --card-border: #23232A;
          --card-title: #E2652C;
          --card-desc: #CFCBC6;
          --card-lang: #8B8884;
        }
      }
      .title { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: var(--card-title); }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: var(--card-desc); }
      .lang { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: var(--card-lang); }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="399" height="119" rx="10" fill="var(--card-bg)" stroke="var(--card-border)"/>
  <text x="20" y="35" class="title">ClientPilot AI</text>
  <text x="20" y="60" class="desc">AI-Assisted lead acquisition platform</text>
  <text x="20" y="78" class="desc">with Overpass API &amp; real-time WebSocket telemetry</text>
  <circle cx="26" cy="100" r="5" fill="#3178C6"/>
  <text x="38" y="104" class="lang">TypeScript / Express</text>
</svg>
