<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="250" viewBox="0 0 1300 250" fill="none">
  <defs>
    <!-- Ember Orange Dynamic Gradient -->
    <linearGradient id="text_gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2652C">
        <animate attributeName="stop-color" values="#E2652C;#F2814F;#FF9E6C;#E2652C" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#F2814F">
        <animate attributeName="stop-color" values="#F2814F;#FF9E6C;#E2652C;#F2814F" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#E2652C">
        <animate attributeName="stop-color" values="#E2652C;#F2814F;#FF9E6C;#E2652C" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Deep Drop Shadow -->
    <filter id="text_pop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <style>
      :root {
        --bg-grad-start: #FFFFFF;
        --bg-grad-end: #F4F2EE;
        --border-col: #E6E2DC;
        --subtitle-col: #44403C;
        --glow-opacity: 0.12;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-grad-start: #17171B;
          --bg-grad-end: #0B0B0D;
          --border-col: #23232A;
          --subtitle-col: #F5F3F0;
          --glow-opacity: 0.16;
        }
      }
      .bg-rect {
        fill: url(#bg_gradient);
        stroke: var(--border-col);
        rx: 16px;
        ry: 16px;
      }
      .name {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 64px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 6px;
        filter: url(#text_pop);
      }
      .subtitle {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 10px;
        fill: var(--subtitle-col);
        filter: url(#text_pop);
      }
      .center-glow {
        opacity: var(--glow-opacity);
      }
    </style>

    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--bg-grad-start)" />
      <stop offset="100%" stop-color="var(--bg-grad-end)" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect x="50" y="25" width="1200" height="200" class="bg-rect" stroke-width="2" />
  
  <!-- Outer Accent Highlight Stroke -->
  <rect x="50" y="25" width="1200" height="200" rx="16" ry="16" fill="none" stroke="url(#text_gradient)" stroke-width="1.5" opacity="0.6" />

  <!-- Center Pulsing Accent -->
  <circle cx="650" cy="125" r="90" fill="url(#text_gradient)" class="center-glow">
    <animate attributeName="r" values="90; 135; 90" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Name -->
  <text x="50%" y="115" text-anchor="middle" class="name" fill="url(#text_gradient)">
    MUHAMMAD REHAN HUSSAIN
  </text>
  
  <!-- Subtitle -->
  <text x="50%" y="155" text-anchor="middle" class="subtitle">
    FULL STACK DEVELOPER | SOFTWARE ENGINEER
  </text>

  <!-- Linear Accent Line -->
  <rect x="250" y="185" width="800" height="2" rx="1" fill="url(#text_gradient)" opacity="0.8">
    <animate attributeName="opacity" values="0.4; 0.95; 0.4" dur="3s" repeatCount="indefinite" />
  </rect>
</svg>
